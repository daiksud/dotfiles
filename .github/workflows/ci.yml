name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zsh and Stow
        run: sudo apt-get update && sudo apt-get install -y zsh stow

      - name: Bootstrap syntax check
        run: |
          for script in bootstrap.sh bootstrap.test.sh homebrew/install.sh chrome/install.sh ghostty/install.sh fonts/install.sh; do
            bash -n "$script"
          done
          test -f homebrew/Brewfile
          test -x homebrew/install.sh
          test -x chrome/install.sh
          test -x ghostty/install.sh
          test -x fonts/install.sh
          ! grep -q '^cask ' homebrew/Brewfile

      - name: Bootstrap smoke test
        run: bash bootstrap.test.sh

      - name: Verify Herdr workspace-first config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          config = tomllib.loads(Path("herdr/.config/herdr/config.toml").read_text())
          keys = config["keys"]
          expected = {
              "prefix": "ctrl+t",
              "workspace_picker": "prefix+w",
              "new_workspace": "prefix+c",
              "rename_workspace": "prefix+shift+t",
              "close_workspace": "prefix+shift+x",
              "previous_workspace": ["prefix+p", "ctrl+alt+h"],
              "next_workspace": ["prefix+n", "ctrl+alt+l"],
              "switch_workspace": "prefix+1..9",
              "cycle_pane_previous": ["prefix+shift+tab", "ctrl+alt+k"],
              "cycle_pane_next": ["prefix+tab", "ctrl+alt+j"],
          }
          for action, binding in expected.items():
              assert keys.get(action) == binding, action
          for action in (
              "new_tab", "rename_tab", "close_tab", "previous_tab",
              "next_tab", "switch_tab", "move_tab_previous", "move_tab_next",
              "new_worktree", "open_worktree", "remove_worktree",
          ):
              assert keys.get(action) == "", action
          ui = config["ui"]
          assert ui["sidebar_start_collapsed"] is True
          assert ui["sidebar_collapsed_mode"] == "hidden"
          assert ui["hide_tab_bar_when_single_tab"] is True
          assert config["theme"]["name"] == "tokyo-night"
          assert not Path("plugins/herdr-tab-status").exists()
          PY

      - name: Codex approval workflow tests
        run: python3 -m unittest discover -s .github/tests -v

      - name: Zsh syntax check (zsh plugins)
        run: |
          status=0
          for f in zsh/.zshrc zsh/.zsh/*.zsh; do
            zsh -n "$f" || status=1
          done
          exit "$status"

      - name: Stow smoke test
        run: |
          trap 'echo "Stow smoke test failed: $BASH_COMMAND" >&2' ERR
          target="$(mktemp -d)"
          packages=(editorconfig fzf git ghostty herdr nvim rumdl sheldon starship zsh)
          stow --no-folding --dir="$PWD" --target="$target" "${packages[@]}"
          test -L "$target/.editorconfig"
          test -L "$target/.gitconfig"
          test -L "$target/.zshrc"
          test -L "$target/.zsh/gh-account.zsh"
          test -L "$target/.zsh/fzf-select-ghqw.zsh"
          test ! -L "$target/.zsh/go-to-repository.zsh"
          test -L "$target/.zsh/fzf-select-history.zsh"
          test ! -e "$target/.zsh/gh-account.test.zsh"
          test ! -L "$target/.zsh/gh-account.test.zsh"
          test ! -e "$target/.zsh/fzf-select-ghqw.test.zsh"
          test ! -e "$target/.zsh/fzf-select-history.test.zsh"
          test ! -e "$target/.stow-local-ignore"
          test -L "$target/.config/fzf/options"
          test "$(cat "$target/.config/fzf/options")" = "$(printf '%s\n' '--height=~40%' '--layout=reverse' '--border=rounded' '--cycle')"
          grep -Fqx 'export FZF_DEFAULT_OPTS_FILE="$HOME/.config/fzf/options"' zsh/.zshrc
          test -L "$target/.config/ghostty/config"
          test ! -e "$target/install.sh"
          test ! -L "$target/install.sh"
          test -L "$target/.config/ghostty/hololive-en-advent.jpg"
          test -L "$target/.config/herdr/config.toml"
          test -L "$target/.config/nvim/init.lua"
          test -L "$target/.config/nvim/lua/config/keymaps.lua"
          test -L "$target/.config/nvim/lua/plugins/tokyonight.lua"
          test ! -e "$target/.config/nvim/lazyvim.json"
          test ! -e "$target/.config/nvim/lazy-lock.json"
          test -L "$target/.config/rumdl/rumdl.toml"
          test -L "$target/.config/sheldon/plugins.toml"
          test -L "$target/.config/starship.toml"
          test -x bootstrap.sh
          stow --no-folding --dir="$PWD" --target="$target" "${packages[@]}"
          stow --delete --no-folding --dir="$PWD" --target="$target" "${packages[@]}"
          test ! -L "$target/.editorconfig"
          test ! -L "$target/.gitconfig"
          test ! -L "$target/.zshrc"
          test ! -L "$target/.config/fzf/options"
          test ! -L "$target/.config/ghostty/config"
          rm -rf "$target"

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Zsh tests
        run: |
          zsh -f zsh/.zsh/gh-account.test.zsh
          zsh -f zsh/.zsh/fzf-select-ghqw.test.zsh
          zsh -f zsh/.zsh/fzf-select-history.test.zsh

