name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Ensure zsh is available
        run: command -v zsh >/dev/null || (sudo apt-get update && sudo apt-get install -y zsh)

      - name: Markdown lint
        run: mise run markdown:lint

      - name: Shellcheck (bash/sh scripts)
        run: shellcheck install.sh scripts/*.sh dotfiles/ghostty/herdr-launch.sh

      - name: Zsh syntax check (zsh plugins)
        run: |
          status=0
          for f in dotfiles/zsh/*.zsh; do
            zsh -n "$f" || status=1
          done
          exit "$status"

      - name: Validate JSON config files
        run: |
          jq empty install_map.json
          jq empty package.json
          jq empty .docusaurus/package.json

      - name: Validate TOML config files
        run: |
          python3 -c "
          import tomllib
          for f in ['.rumdl.toml', 'mise.toml', 'dotfiles/starship.toml']:
              with open(f, 'rb') as fh:
                  tomllib.load(fh)
          "

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: Ensure zsh is available
        run: command -v zsh >/dev/null || (sudo apt-get update && sudo apt-get install -y zsh)

      - name: Run bats tests
        run: bats tests

  docs-build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@143f5f385f39b1b753ffed1a01ad443811855c8b # v1.16.1
        with:
          working-directory: .docusaurus
          node-version: lts
          cache: true
          run-install: false

      - name: Install dependencies
        working-directory: .docusaurus
        run: vp install --frozen-lockfile

      - name: Build
        working-directory: .docusaurus
        run: vp run build
