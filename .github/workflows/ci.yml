name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install Zsh and Stow
        run: sudo apt-get update && sudo apt-get install -y zsh stow

      - name: Markdown lint
        run: mise run markdown:lint

      - name: Installer syntax check
        run: bash -n install.sh

      - name: Zsh syntax check (zsh plugins)
        run: |
          status=0
          for f in zsh/.zshrc zsh/.zsh/*.zsh; do
            zsh -n "$f" || status=1
          done
          exit "$status"

      - name: Validate JSON config files
        run: |
          jq empty nvim/.config/nvim/lazyvim.json nvim/.config/nvim/lazy-lock.json

      - name: Validate TOML config files
        run: |
          python3 -c "
          import tomllib
          for f in ['.rumdl.toml', 'mise.toml', 'herdr/.config/herdr/config.toml', 'rumdl/.config/rumdl/rumdl.toml', 'sheldon/.config/sheldon/plugins.toml', 'starship/.config/starship.toml']:
              with open(f, 'rb') as fh:
                  tomllib.load(fh)
          "

      - name: Stow smoke test
        run: |
          target="$(mktemp -d)"
          packages=(git ghostty herdr nvim rumdl sheldon starship zsh)
          stow --no-folding --dir="$PWD" --target="$target" "${packages[@]}"
          test -L "$target/.gitconfig"
          test -L "$target/.zshrc"
          test -L "$target/.zsh/gh-account.zsh"
          test ! -e "$target/.zsh/gh-account.test.zsh"
          test ! -L "$target/.zsh/gh-account.test.zsh"
          test ! -e "$target/.stow-local-ignore"
          test -L "$target/.config/ghostty/config"
          test -L "$target/.config/ghostty/hololive-en-advent.jpg"
          test -L "$target/.config/herdr/config.toml"
          test -L "$target/.config/nvim/init.lua"
          test -L "$target/.config/rumdl/rumdl.toml"
          test -L "$target/.config/sheldon/plugins.toml"
          test -L "$target/.config/starship.toml"
          test -x install.sh
          stow --no-folding --dir="$PWD" --target="$target" "${packages[@]}"
          stow --delete --no-folding --dir="$PWD" --target="$target" "${packages[@]}"
          test ! -L "$target/.gitconfig"
          test ! -L "$target/.zshrc"
          test ! -L "$target/.config/ghostty/config"
          rm -rf "$target"

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Zsh tests
        run: zsh -f zsh/.zsh/gh-account.test.zsh

