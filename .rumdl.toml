[global]
disable = ["MD013", "MD046"]
extend-enable = ["MD060"]
flavor = "gfm"

[per-file-flavor]
"**/*.mdx" = "mdx"

[per-file-ignores]
".claude/rules/github-actions.md" = ["MD041"]
"CLAUDE.md" = ["MD041"]
"docs/README.mdx" = ["MD014", "MD025"]
"dotfiles/agent-instructions.md" = ["MD025"]

[MD060]
style = "compact"
