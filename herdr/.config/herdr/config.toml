onboarding = false

[theme]
name = "tokyo-night"

[keys]
prefix = "ctrl+t"
# Keep workspaces internal; navigate tabs instead.
new_workspace = ""
previous_tab = ["prefix+p", "ctrl+alt+h"]
next_tab = ["prefix+n", "ctrl+alt+l"]
cycle_pane_previous = ["prefix+shift+tab", "ctrl+alt+j"]
cycle_pane_next = ["prefix+tab", "ctrl+alt+k"]

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
tab_bar_position = "top"
hide_tab_bar_when_single_tab = true
prompt_new_tab_name = false

[ui.sound]
enabled = false
