onboarding = false

[theme]
name = "tokyo-night"

[keys]
prefix = "ctrl+t"

# Workspaces are the navigation unit; show the sidebar by default.
workspace_picker = "prefix+w"
new_workspace = "prefix+c"
rename_workspace = "prefix+shift+t"
close_workspace = "prefix+shift+x"
previous_workspace = ["prefix+p", "ctrl+alt+h"]
next_workspace = ["prefix+n", "ctrl+alt+l"]
switch_workspace = "prefix+1..9"

# Worktree management is intentionally not bound in Herdr.
new_worktree = ""
open_worktree = ""
remove_worktree = ""

# Keep a single (internal) tab per workspace.
new_tab = ""
rename_tab = ""
close_tab = ""
previous_tab = ""
next_tab = ""
switch_tab = ""
move_tab_previous = ""
move_tab_next = ""

# Prefix cycling stays within the current tab.
cycle_pane_previous = "prefix+shift+tab"
cycle_pane_next = "prefix+tab"

[[keys.command]]
key = "ctrl+alt+j"
type = "shell"
command = 'python3 "$HOME/.config/herdr/cycle-pane.py" next'

[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
command = 'python3 "$HOME/.config/herdr/cycle-pane.py" previous'

[ui]
sidebar_start_collapsed = false
sidebar_collapsed_mode = "hidden"
hide_tab_bar_when_single_tab = true

[ui.sound]
enabled = false
