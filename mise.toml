[tools]
bun = "latest"
bats = "latest"
shellcheck = "latest"
python = "latest"
rumdl = "0.2.44"

[hooks]
postinstall = "bun install --frozen-lockfile"

[tasks."markdown:format"]
description = "Format Markdown files with rumdl"
run = "rumdl fmt ."

[tasks."markdown:lint"]
description = "Lint Markdown files with rumdl"
run = "rumdl check ."

[settings]
lockfile = true
experimental = true
