id = "daiksud.tab-agent-status"
name = "Tab Directory and Agent Status"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Keep tab names in sync with the focused pane's directory and the most urgent agent status."
platforms = ["macos"]

[[actions]]
id = "sync"
title = "Synchronize tab directories and agent statuses"
command = ["node", "sync.mjs"]

[[events]]
on = "tab.created"
command = ["node", "sync.mjs"]

[[events]]
on = "tab.focused"
command = ["node", "sync.mjs"]

[[events]]
on = "tab.moved"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.created"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.closed"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.exited"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.focused"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.moved"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.agent_detected"
command = ["node", "sync.mjs"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "sync.mjs"]

[[events]]
on = "workspace.focused"
command = ["node", "sync.mjs"]

[[events]]
on = "worktree.opened"
command = ["node", "sync.mjs"]
